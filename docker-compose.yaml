services:
  web:
    container_name: chambredescles_web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8083:80'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./app:/var/www/html/
      - ./vendor:/var/www/html/vendor
      # Accès au dossier des sauvegardes depuis le conteneur web
      - ./backups:/var/backups
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - TZ=Europe/Paris
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - chambredescles_net

  db:
    container_name: chambredescles_db
    image: mariadb:11.4
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - DEMO_DATA=${DEMO_DATA:-false}
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
      # Montage du dossier de sauvegardes en lecture seule pour la DB
      - ./backups:/var/backups
      - ./app/database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./app/database/script.sql:/app/database/script.sql
      - ./app/database/demo.sql:/app/database/demo.sql
    networks:
      - chambredescles_net

  mysql-cron-backup:
    image: fradelg/mysql-cron-backup:1.15.0
    container_name: chambredescles_backup
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron || pgrep crond || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./backups:/backup
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASS=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MAX_BACKUPS=15
      - INIT_BACKUP=0
      - USE_PLAIN_SQL=1
      # Sauvegarde tous les jours à 19:30 
      - CRON_TIME=30 19 * * *
      # Option requise MariaDB
      - MYSQLDUMP_OPTS=--no-tablespaces --skip-ssl
      - TZ=Europe/Paris
    networks:
      - chambredescles_net

## touche pas au volumes, sinon tu perds la base de données !!
volumes:
  db_data:

networks:
  chambredescles_net:
    driver: bridge
